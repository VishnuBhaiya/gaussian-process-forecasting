name: Portfolio checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt nbformat ipython
      - run: python scripts/validate_notebooks.py
      - run: python verify_correctness.py
